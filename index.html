<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tid Är Pengar</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .app-container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
        }
        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 25px;
            color: #4cd964;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            cursor: pointer;
        }
        .checkbox-group input {
            width: auto;
            cursor: pointer;
            transform: scale(1.2);
        }
        .checkbox-group label {
            margin-bottom: 0;
            cursor: pointer;
            color: #dddddd;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #b3b3b3;
        }
        input[type="number"], select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #333;
            background-color: #2a2a2a;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background-color: #4cd964;
            color: #000000;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #3fe25a;
        }
        .result-container {
            margin-top: 25px;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            display: none;
            background-color: #2a2a2a;
            transition: all 0.3s ease;
        }
        .result-value {
            font-size: 36px;
            font-weight: bold;
            margin: 10px 0;
        }
        .result-days {
            font-size: 15px;
            color: #cccccc;
            margin-bottom: 15px;
        }
        .comment-box {
            font-style: italic;
            font-weight: 500;
            padding: 10px;
            border-radius: 8px;
            background-color: rgba(0,0,0,0.2);
            margin-top: 10px;
        }
        
        /* Färgtema för smärttröskel */
        .status-green { border: 2px solid #4cd964; color: #4cd964; }
        .status-yellow { border: 2px solid #ffcc00; color: #ffcc00; }
        .status-red { border: 2px solid #ff3b30; color: #ff3b30; }
    </style>
</head>
<body>

    <div class="app-container">
        <h1>Tid Är Pengar ⏳</h1>
        
        <div class="input-group">
            <label for="lon">Din månadslön före skatt (kr)</label>
            <input type="number" id="lon" placeholder="t.ex. 40000" value="40000">
        </div>

        <div class="input-group">
            <label for="veckotimmar">Arbetstimmar per vecka (h/vecka)</label>
            <input type="number" id="veckotimmar" placeholder="t.ex. 40" value="40">
        </div>

        <!-- NYTT FÄLT: Skattetabell -->
        <div class="input-group">
            <label for="skattetabell">Din skattetabell (kommunalskatt)</label>
            <select id="skattetabell">
                <option value="30">Tabell 30 (ca 30% kommunalskatt)</option>
                <option value="31">Tabell 31 (ca 31% kommunalskatt)</option>
                <option value="32" selected>Tabell 32 (ca 32% kommunalskatt)</option>
                <option value="33">Tabell 33 (ca 33% kommunalskatt)</option>
                <option value="34">Tabell 34 (ca 34% kommunalskatt)</option>
                <option value="35">Tabell 35 (ca 35% kommunalskatt)</option>
                <option value="36">Tabell 36 (ca 36% kommunalskatt)</option>
            </select>
        </div>

        <div class="checkbox-group">
            <input type="checkbox" id="kyrkan">
            <label for="kyrkan">Medlem i Svenska kyrkan (~1% extra)</label>
        </div>
        
        <div class="input-group">
            <label for="pris">Vad kostar varan/tjänsten? (kr)</label>
            <input type="number" id="pris" placeholder="t.ex. 5000">
        </div>
        
        <button onclick="raknaUt()">Räkna ut arbetstid</button>
        
        <div class="result-container" id="resultatSektion">
            <label style="color:#aaa;">Detta köp kommer kosta dig:</label>
            <div class="result-value" id="timSvar">0 timmar</div>
            <div class="result-days" id="dagSvar">Motsvarar 0 arbetsdagar</div>
            <div class="comment-box" id="kommentarSvar"></div>
        </div>
    </div>

    <script>
        const kommentarer = {
            gron: [
                "Lugnt för plånboken! Passa på.",
                "Bara en kort stund vid skrivbordet.",
                "Ett litet streck i kalkylen, det överlever du!",
                "Fickpengar i sammanhanget.",
                "Svisch sa det, knappt märkbart!"
            ],
            gul: [
                "Nu börjar det faktiskt märkas!",
                "Det här kostar dig nästan en hel arbetsdag eller två.",
                "Tänk till en extra gång – behöver du verkligen den?",
                "En märkbar investering i din arbetstid.",
                "Känns det fortfarande värt det efter två dagar på jobbet?"
            ],
            rod: [
                "Oj, oj, oj... det här kostade visst en hel del!",
                "Du får jobba en halv evighet för det här köpet.",
                "Säker på att du inte klarar dig helt utan?",
                "Det här är en rejäl tugga av din månadslön!",
                "Dags att fundera på om du hellre vill ta utkomsten i ledighet?"
            ]
        };

        window.onload = function() {
            if (localStorage.getItem('lon')) document.getElementById('lon').value = localStorage.getItem('lon');
            if (localStorage.getItem('veckotimmar')) document.getElementById('veckotimmar').value = localStorage.getItem('veckotimmar');
            if (localStorage.getItem('skattetabell')) document.getElementById('skattetabell').value = localStorage.getItem('skattetabell');
            if (localStorage.getItem('kyrkan')) document.getElementById('kyrkan').checked = localStorage.getItem('kyrkan') === 'true';
        };

        function beraknaNettoLon(brutto, tabell, arMedlemIKyrkan) {
            // Beräkning av effektiv skattesats baserad på skattetabell + jobbskatteavdrag
            let nominellSkatt = parseFloat(tabell) / 100;
            if (arMedlemIKyrkan) {
                nominellSkatt += 0.01; // Ca 1% kyrkoavgift
            }

            // Uppskattad effektiv skatt efter jobbskatteavdrag & grundavdrag för vanliga inkomster
            // Jobbskatteavdraget reducerar den faktiska skatteprocenten med ca 7-9 procentenheter
            let effektivSkatt = nominellSkatt - 0.085; 

            // Statlig inkomstskatt (20%) över brytpunkten (ca 51 200 kr/mån)
            if (brutto > 51200) {
                const overSkikt = brutto - 51200;
                const statligSkatt = overSkikt * 0.20;
                const basNetto = (51200 * (1 - effektivSkatt));
                return basNetto + (overSkikt * (1 - (effektivSkatt + 0.20)));
            }

            return brutto * (1 - effektivSkatt);
        }

        function raknaUt() {
            const manadslon = parseFloat(document.getElementById('lon').value);
            const veckotimmar = parseFloat(document.getElementById('veckotimmar').value);
            const skattetabell = document.getElementById('skattetabell').value;
            const pris = parseFloat(document.getElementById('pris').value);
            const arMedlemIKyrkan = document.getElementById('kyrkan').checked;
            
            if (!manadslon || !pris || !veckotimmar) {
                alert("Vänligen fyll i alla fält!");
                return;
            }

            // Spara värden i mobilen
            localStorage.setItem('lon', manadslon);
            localStorage.setItem('veckotimmar', veckotimmar);
            localStorage.setItem('skattetabell', skattetabell);
            localStorage.setItem('kyrkan', arMedlemIKyrkan);
            
            const arbetstimmarPerManad = (veckotimmar * 52) / 12;
            const nettoLon = beraknaNettoLon(manadslon, skattetabell, arMedlemIKyrkan);
            const nettoTimlon = nettoLon / arbetstimmarPerManad;
            const timmarSomKravs = pris / nettoTimlon;
            
            const timmarPerDag = veckotimmar / 5; 
            const dagarSomKravs = timmarSomKravs / timmarPerDag;
            
            document.getElementById('timSvar').innerText = timmarSomKravs.toFixed(1) + ' timmar';
            document.getElementById('dagSvar').innerText = 'Motsvarar cirka ' + dagarSomKravs.toFixed(1) + ' arbetsdagar efter skatt';
            
            const resSektion = document.getElementById('resultatSektion');
            const timValEl = document.getElementById('timSvar');
            const kommentarEl = document.getElementById('kommentarSvar');
            
            resSektion.className = 'result-container';
            
            let valdKategori = 'gron';
            if (timmarSomKravs < 4) {
                resSektion.classList.add('status-green');
                timValEl.style.color = '#4cd964';
                valdKategori = 'gron';
            } else if (timmarSomKravs <= 16) {
                resSektion.classList.add('status-yellow');
                timValEl.style.color = '#ffcc00';
                valdKategori = 'gul';
            } else {
                resSektion.classList.add('status-red');
                timValEl.style.color = '#ff3b30';
                valdKategori = 'rod';
            }

            const lista = kommentarer[valdKategori];
            const slumpadKommentar = lista[Math.floor(Math.random() * lista.length)];
            kommentarEl.innerText = `"${slumpadKommentar}"`;
            
            resSektion.style.display = 'block';
        }
    </script>

</body>
</html>
