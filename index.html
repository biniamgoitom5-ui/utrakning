<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tid Är Pengar</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .app-container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 420px;
        }
        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 25px;
            color: #4cd964;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            cursor: pointer;
        }
        .checkbox-group input {
            width: auto;
            cursor: pointer;
            transform: scale(1.2);
        }
        .checkbox-group label {
            margin-bottom: 0;
            cursor: pointer;
            color: #dddddd;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #b3b3b3;
        }
        input[type="number"], input[type="text"], select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #333;
            background-color: #2a2a2a;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
        }
        .btn-main {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background-color: #4cd964;
            color: #000000;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }
        .btn-main:hover {
            background-color: #3fe25a;
        }
        .btn-save {
            width: 100%;
            padding: 12px;
            border: 1px solid #4cd964;
            border-radius: 10px;
            background-color: transparent;
            color: #4cd964;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 12px;
            transition: all 0.2s;
        }
        .btn-save:hover {
            background-color: rgba(76, 217, 100, 0.1);
        }
        .result-container {
            margin-top: 25px;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            display: none;
            background-color: #2a2a2a;
            transition: all 0.3s ease;
        }
        .result-value {
            font-size: 36px;
            font-weight: bold;
            margin: 10px 0;
        }
        .result-days {
            font-size: 15px;
            color: #cccccc;
            margin-bottom: 15px;
        }
        .comment-box {
            font-style: italic;
            font-weight: 500;
            padding: 10px;
            border-radius: 8px;
            background-color: rgba(0,0,0,0.2);
            margin-top: 10px;
        }
        
        /* Historiksektion */
        .history-section {
            margin-top: 35px;
            border-top: 1px solid #333;
            padding-top: 20px;
            display: none;
        }
        .history-section h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #dddddd;
        }
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .history-item {
            background-color: #2a2a2a;
            padding: 12px 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 5px solid #888;
        }
        .history-info {
            display: flex;
            flex-direction: column;
        }
        .history-title {
            font-weight: bold;
            font-size: 15px;
            color: #ffffff;
        }
        .history-details {
            font-size: 13px;
            color: #aaa;
            margin-top: 2px;
        }
        .history-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .history-time {
            font-weight: bold;
            font-size: 15px;
        }
        .delete-btn {
            background: none;
            border: none;
            color: #777;
            font-size: 18px;
            cursor: pointer;
            padding: 0 5px;
        }
        .delete-btn:hover {
            color: #ff3b30;
        }

        /* Färgtema för smärttröskel */
        .status-green { border-color: #4cd964; color: #4cd964; }
        .status-yellow { border-color: #ffcc00; color: #ffcc00; }
        .status-red { border-color: #ff3b30; color: #ff3b30; }

        .item-green { border-left-color: #4cd964; }
        .item-green .history-time { color: #4cd964; }

        .item-yellow { border-left-color: #ffcc00; }
        .item-yellow .history-time { color: #ffcc00; }

        .item-red { border-left-color: #ff3b30; }
        .item-red .history-time { color: #ff3b30; }
    </style>
</head>
<body>

    <div class="app-container">
        <h1>Tid Är Pengar ⏳</h1>
        
        <div class="input-group">
            <label for="lon">Din månadslön före skatt (kr)</label>
            <input type="number" id="lon" placeholder="t.ex. 40000" value="40000">
        </div>

        <div class="input-group">
            <label for="veckotimmar">Arbetstimmar per vecka (h/vecka)</label>
            <input type="number" id="veckotimmar" placeholder="t.ex. 40" value="40">
        </div>

        <div class="input-group">
            <label for="skattetabell">Din skattetabell (kommunalskatt)</label>
            <select id="skattetabell">
                <option value="30">Tabell 30 (ca 30% kommunalskatt)</option>
                <option value="31">Tabell 31 (ca 31% kommunalskatt)</option>
                <option value="32" selected>Tabell 32 (ca 32% kommunalskatt)</option>
                <option value="33">Tabell 33 (ca 33% kommunalskatt)</option>
                <option value="34">Tabell 34 (ca 34% kommunalskatt)</option>
                <option value="35">Tabell 35 (ca 35% kommunalskatt)</option>
                <option value="36">Tabell 36 (ca 36% kommunalskatt)</option>
            </select>
        </div>

        <div class="checkbox-group">
            <input type="checkbox" id="kyrkan">
            <label for="kyrkan">Medlem i Svenska kyrkan (~1% extra)</label>
        </div>

        <div class="input-group">
            <label for="namn">Vad vill du köpa? (Valfritt)</label>
            <input type="text" id="namn" placeholder="t.ex. Kaffebryggare">
        </div>
        
        <div class="input-group">
            <label for="pris">Vad kostar varan/tjänsten? (kr)</label>
            <input type="number" id="pris" placeholder="t.ex. 5000">
        </div>
        
        <button class="btn-main" onclick="raknaUt()">Räkna ut arbetstid</button>
        
        <div class="result-container" id="resultatSektion">
            <label style="color:#aaa;">Detta köp kommer kosta dig:</label>
            <div class="result-value" id="timSvar">0 timmar</div>
            <div class="result-days" id="dagSvar">Motsvarar 0 arbetsdagar</div>
            <div class="comment-box" id="kommentarSvar"></div>
            <button class="btn-save" onclick="sparaKop()">➕ Spara i min lista</button>
        </div>

        <!-- Sektion för sparade köp -->
        <div class="history-section" id="historikSektion">
            <h2>Sparade köp & jämförelser</h2>
            <div class="history-list" id="historikLista"></div>
        </div>
    </div>

    <script>
        const kommentarer = {
            gron: [
                "Lugnt för plånboken! Passa på.",
                "Bara en kort stund vid skrivbordet.",
                "Ett litet streck i kalkylen, det överlever du!",
                "Fickpengar i sammanhanget.",
                "Svisch sa det, knappt märkbart!"
            ],
            gul: [
                "Nu börjar det faktiskt märkas!",
                "Det här kostar dig nästan en hel arbetsdag eller två.",
                "Tänk till en extra gång – behöver du verkligen den?",
                "En märkbar investering i din arbetstid.",
                "Känns det fortfarande värt det efter två dagar på jobbet?"
            ],
            rod: [
                "Oj, oj, oj... det här kostade visst en hel del!",
                "Du får jobba en halv evighet för det här köpet.",
                "Säker på att du inte klarar dig helt utan?",
                "Det här är en rejäl tugga av din månadslön!",
                "Dags att fundera på om du hellre vill ta utkomsten i ledighet?"
            ]
        };

        let nuvarandeBerakning = null;
        let sparadeKopLista = [];

        window.onload = function() {
            if (localStorage.getItem('lon')) document.getElementById('lon').value = localStorage.getItem('lon');
            if (localStorage.getItem('veckotimmar')) document.getElementById('veckotimmar').value = localStorage.getItem('veckotimmar');
            if (localStorage.getItem('skattetabell')) document.getElementById('skattetabell').value = localStorage.getItem('skattetabell');
            if (localStorage.getItem('kyrkan')) document.getElementById('kyrkan').checked = localStorage.getItem('kyrkan') === 'true';

            // Ladda sparade köp
            const sparat = localStorage.getItem('sparadeKop');
            if (sparat) {
                sparadeKopLista = JSON.parse(sparat);
                renderaHistorik();
            }
        };

        function beraknaNettoLon(brutto, tabell, arMedlemIKyrkan) {
            let nominellSkatt = parseFloat(tabell) / 100;
            if (arMedlemIKyrkan) nominellSkatt += 0.01;

            let effektivSkatt = nominellSkatt - 0.085; 

            if (brutto > 51200) {
                const overSkikt = brutto - 51200;
                const basNetto = (51200 * (1 - effektivSkatt));
                return basNetto + (overSkikt * (1 - (effektivSkatt + 0.20)));
            }

            return brutto * (1 - effektivSkatt);
        }

        function raknaUt() {
            const manadslon = parseFloat(document.getElementById('lon').value);
            const veckotimmar = parseFloat(document.getElementById('veckotimmar').value);
            const skattetabell = document.getElementById('skattetabell').value;
            const pris = parseFloat(document.getElementById('pris').value);
            const produktNamn = document.getElementById('namn').value.trim() || 'Namnlöst köp';
            const arMedlemIKyrkan = document.getElementById('kyrkan').checked;
            
            if (!manadslon || !pris || !veckotimmar) {
                alert("Vänligen fyll i alla fält!");
                return;
            }

            localStorage.setItem('lon', manadslon);
            localStorage.setItem('veckotimmar', veckotimmar);
            localStorage.setItem('skattetabell', skattetabell);
            localStorage.setItem('kyrkan', arMedlemIKyrkan);
            
            const arbetstimmarPerManad = (veckotimmar * 52) / 12;
            const nettoLon = beraknaNettoLon(manadslon, skattetabell, arMedlemIKyrkan);
            const nettoTimlon = nettoLon / arbetstimmarPerManad;
            const timmarSomKravs = pris / nettoTimlon;
            
            const timmarPerDag = veckotimmar / 5; 
            const dagarSomKravs = timmarSomKravs / timmarPerDag;
            
            document.getElementById('timSvar').innerText = timmarSomKravs.toFixed(1) + ' timmar';
            document.getElementById('dagSvar').innerText = 'Motsvarar cirka ' + dagarSomKravs.toFixed(1) + ' arbetsdagar efter skatt';
            
            const resSektion = document.getElementById('resultatSektion');
            const timValEl = document.getElementById('timSvar');
            const kommentarEl = document.getElementById('kommentarSvar');
            
            resSektion.className = 'result-container';
            
            let valdKategori = 'gron';
            if (timmarSomKravs < 4) {
                resSektion.classList.add('status-green');
                timValEl.style.color = '#4cd964';
                valdKategori = 'gron';
            } else if (timmarSomKravs <= 16) {
                resSektion.classList.add('status-yellow');
                timValEl.style.color = '#ffcc00';
                valdKategori = 'gul';
            } else {
                resSektion.classList.add('status-red');
                timValEl.style.color = '#ff3b30';
                valdKategori = 'rod';
            }

            const lista = kommentarer[valdKategori];
            const slumpadKommentar = lista[Math.floor(Math.random() * lista.length)];
            kommentarEl.innerText = `"${slumpadKommentar}"`;
            
            resSektion.style.display = 'block';

            // Spara data i minnet utifall användaren vill lägga till i listan
            nuvarandeBerakning = {
                namn: produktNamn,
                pris: pris,
                timmar: timmarSomKravs.toFixed(1),
                kategori: valdKategori,
                id: Date.now()
            };
        }

        function sparaKop() {
            if (!nuvarandeBerakning) return;
            
            sparadeKopLista.unshift(nuvarandeBerakning);
            localStorage.setItem('sparadeKop', JSON.stringify(sparadeKopLista));
            
            renderaHistorik();
            
            // Töm namn och pris-fälten för nästa uträkning
            document.getElementById('namn').value = '';
            document.getElementById('pris').value = '';
            document.getElementById('resultatSektion').style.display = 'none';
            nuvarandeBerakning = null;
        }

        function taBortKop(id) {
            sparadeKopLista = sparadeKopLista.filter(item => item.id !== id);
            localStorage.setItem('sparadeKop', JSON.stringify(sparadeKopLista));
            renderaHistorik();
        }

        function renderaHistorik() {
            const sek = document.getElementById('historikSektion');
            const listaEl = document.getElementById('historikLista');
            
            if (sparadeKopLista.length === 0) {
                sek.style.display = 'none';
                return;
            }

            sek.style.display = 'block';
            listaEl.innerHTML = '';

            sparadeKopLista.forEach(item => {
                const div = document.createElement('div');
                div.className = `history-item item-${item.kategori}`;
                div.innerHTML = `
                    <div class="history-info">
                        <span class="history-title">${item.namn}</span>
                        <span class="history-details">${item.pris.toLocaleString('sv-SE')} kr</span>
                    </div>
                    <div class="history-right">
                        <span class="history-time">${item.timmar} h</span>
                        <button class="delete-btn" onclick="taBortKop(${item.id})">✕</button>
                    </div>
                `;
                listaEl.appendChild(div);
            });
        }
    </script>

</body>
</html>
