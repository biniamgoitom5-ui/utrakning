<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tid Är Pengar</title>
    <style>
        /* Här bestämmer vi hur appen ser ut (Designen) */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .app-container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
        }
        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 25px;
            color: #4cd964;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #b3b3b3;
        }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #333;
            background-color: #2a2a2a;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background-color: #4cd964;
            color: #000000;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #3fe25a;
        }
        .result-container {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #333;
            text-align: center;
            display: none; /* Dold tills man klickar på knappen */
        }
        .result-value {
            font-size: 36px;
            font-weight: bold;
            color: #4cd964;
            margin: 10px 0;
        }
        .result-days {
            font-size: 16px;
            color: #b3b3b3;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <h1>Tid Är Pengar ⏳</h1>
        
        <div class="input-group">
            <label for="lon">Din månadslön före skatt (kr)</label>
            <input type="number" id="lon" placeholder="t.ex. 40000" value="40000">
        </div>
        
        <div class="input-group">
            <label for="pris">Vad kostar varan/tjänsten? (kr)</label>
            <input type="number" id="pris" placeholder="t.ex. 5000">
        </div>
        
        <button onclick="raknaUt()">Räkna ut arbetstid</button>
        
        <div class="result-container" id="resultatSektion">
            <label>Detta köp kommer kosta dig:</label>
            <div class="result-value" id="timSvar">0 timmar</div>
            <div class="result-days" id="dagSvar">Motsvarar 0 arbetsdagar</div>
        </div>
    </div>

    <script>
        function raknaUt() {
            // Hämta siffrorna som användaren skrev in
            const manadslon = parseFloat(document.getElementById('lon').value);
            const pris = parseFloat(document.getElementById('pris').value);
            
            // Om något fält är tomt, gör inget
            if (!manadslon || !pris) {
                alert("Vänligen fyll i både lön och pris!");
                return;
            }
            
            // Samma logik vi använde i våra tidigare exempel
            const skattesats = 0.23; // Ca 23% effektiv skatt (inkl. jobbskatteavdrag)
            const arbetstimmarPerManad = 174;
            
            const nettoLon = manadslon * (1 - skattesats);
            const nettoTimlon = nettoLon / arbetstimmarPerManad;
            
            const timmarSomKravs = pris / nettoTimlon;
            const dagarSomKravs = timmarSomKravs / 8; // Baserat på 8h arbetsdag
            
            // Visa resultatet på skärmen
            document.getElementById('timSvar').innerText = timmarSomKravs.toFixed(1) + ' timmar';
            document.getElementById('dagSvar').innerText = 'Motsvarar cirka ' + dagarSomKravs.toFixed(1) + ' arbetsdagar efter skatt';
            
            // Gör resultatboxen synlig
            document.getElementById('resultatSektion').style.display = 'block';
        }
    </script>

</body>
</html>
