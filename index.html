<style>
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #121212;
        color: #ffffff;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
        box-sizing: border-box;
    }
    .app-container {
        background-color: #1e1e1e;
        padding: 30px;
        border-radius: 20px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        width: 100%;
        max-width: 420px;
    }
    h1 {
        text-align: center;
        font-size: 24px;
        margin-bottom: 25px;
        color: #4cd964;
    }
    .input-group {
        margin-bottom: 20px;
    }
    .checkbox-group {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 20px;
        cursor: pointer;
    }
    .checkbox-group input {
        width: auto;
        cursor: pointer;
        transform: scale(1.2);
    }
    .checkbox-group label {
        margin-bottom: 0;
        cursor: pointer;
        color: #dddddd;
    }
    label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        color: #b3b3b3;
    }
    input[type="number"], input[type="text"], select {
        width: 100%;
        padding: 12px;
        border-radius: 10px;
        border: 1px solid #333;
        background-color: #2a2a2a;
        color: white;
        font-size: 16px;
        box-sizing: border-box;
    }
    .btn-main {
        width: 100%;
        padding: 15px;
        border: none;
        border-radius: 10px;
        background-color: #4cd964;
        color: #000000;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: background-color 0.2s;
        margin-top: 10px;
    }
    .btn-main:hover {
        background-color: #3fe25a;
    }
    .btn-save {
        width: 100%;
        padding: 12px;
        border: 1px solid #4cd964;
        border-radius: 10px;
        background-color: transparent;
        color: #4cd964;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 12px;
        transition: all 0.2s;
    }
    .btn-save:hover {
        background-color: rgba(76, 217, 100, 0.1);
    }
    .result-container {
        margin-top: 25px;
        padding: 20px;
        border-radius: 12px;
        text-align: center;
        display: none;
        background-color: #2a2a2a;
        transition: all 0.3s ease;
    }
    .result-value {
        font-size: 36px;
        font-weight: bold;
        margin: 10px 0;
    }
    .result-days {
        font-size: 15px;
        color: #cccccc;
        margin-bottom: 15px;
    }
    .comment-box {
        font-style: italic;
        font-weight: 500;
        padding: 10px;
        border-radius: 8px;
        background-color: rgba(0,0,0,0.2);
        margin-top: 10px;
    }
    
    /* Historiksektion */
    .history-section {
        margin-top: 35px;
        border-top: 1px solid #333;
        padding-top: 20px;
        display: none;
    }
    .history-section h2 {
        font-size: 18px;
        margin-bottom: 15px;
        color: #dddddd;
    }
    .history-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    .history-item {
        background-color: #2a2a2a;
        padding: 12px 15px;
        border-radius: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border: 2px solid transparent; /* Kontur inställd som standard */
        transition: all 0.2s ease;
    }
    .history-info {
        display: flex;
        flex-direction: column;
    }
    .history-title {
        font-weight: bold;
        font-size: 15px;
        color: #ffffff;
    }
    .history-details {
        font-size: 13px;
        color: #aaa;
        margin-top: 2px;
    }
    .history-right {
        display: flex;
        align-items: center;
        gap: 12px;
    }
    .history-time {
        font-weight: bold;
        font-size: 15px;
    }
    .delete-btn {
        background: none;
        border: none;
        color: #777;
        font-size: 18px;
        cursor: pointer;
        padding: 0 5px;
    }
    .delete-btn:hover {
        color: #ff3b30;
    }

    /* Färgtema för huvudresultat */
    .status-green { border: 2px solid #4cd964; color: #4cd964; }
    .status-yellow { border: 2px solid #ffcc00; color: #ffcc00; }
    .status-red { border: 2px solid #ff3b30; color: #ff3b30; }

    /* Färgade konturer för sparade rader */
    .item-green { border-color: #4cd964; }
    .item-green .history-time { color: #4cd964; }

    .item-yellow { border-color: #ffcc00; }
    .item-yellow .history-time { color: #ffcc00; }

    .item-red { border-color: #ff3b30; }
    .item-red .history-time { color: #ff3b30; }
</style>
